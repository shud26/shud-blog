<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 260" font-family="system-ui, sans-serif">
  <rect width="820" height="260" fill="#f9fafb"/>
  <text x="30" y="36" font-size="17" font-weight="700" fill="#111">$1,000을 셋으로 쪼갠다 (개념)</text>
  <text x="30" y="56" font-size="12" fill="#9ca3af">수익 배분이 아니라 "역할" 배분. 각자 목적이 다르다.</text>

  <!-- bar -->
  <g>
    <rect x="30"  y="80" width="462" height="70" rx="8" fill="#dbeafe" stroke="#93c5fd"/>
    <rect x="500" y="80" width="222" height="70" rx="8" fill="#dcfce7" stroke="#86efac"/>
    <rect x="730" y="80" width="60"  height="70" rx="8" fill="#fef9c3" stroke="#fde68a"/>
  </g>
  <g text-anchor="middle">
    <text x="261" y="108" font-size="15" font-weight="700" fill="#1e3a8a">~$600 · 카피/검증 봇</text>
    <text x="261" y="130" font-size="12" fill="#1e40af">보는 눈을 실전 자본으로 검증 (핵심)</text>
    <text x="611" y="108" font-size="14" font-weight="700" fill="#166534">~$300 · Aave 앵커</text>
    <text x="611" y="130" font-size="11" fill="#166534">노는 돈 · FOMO 차단</text>
    <text x="760" y="105" font-size="12" font-weight="700" fill="#92400e">$100</text>
    <text x="760" y="124" font-size="10" fill="#92400e">실험·학습</text>
  </g>

  <text x="30" y="185" font-size="13" fill="#374151" font-weight="700">수용 기준 (variational 함정 회피):</text>
  <g font-size="12.5" fill="#4b5563">
    <text x="30" y="208">· 1주 이상 무인 가동 — 수동 리밸런싱 0 (손 가는 순간 실패)</text>
    <text x="30" y="230">· 모든 체결 자동 기록 → PnL이 0이어도 온체인 연재 데이터가 남게</text>
    <text x="30" y="252">· 거래당 손실 상한 + 라이브 전 내 PnL 리더로 백테스트</text>
  </g>
</svg>
